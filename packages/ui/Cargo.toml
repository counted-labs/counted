[package]
name = "ui"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
tracing = "0.1.41"
# No `default-features = false`: `api` declares no `default` feature, so it was a no-op - and cargo
# warns that ignoring it here may become a hard error, because the workspace dependency does not set
# it either.
api = { workspace = true }
shared = { workspace = true }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
chrono = "0.4.41"
# Fluent-based i18n. The Dioxus glue (context, `tid!`, per-locale lazy loading) is our own, in
# src/i18n.rs - see DOCUMENTATION.md §11.
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }
web-sys = { version = "0.3.77", features = ["Window", "Storage", "Location", "History", "Element", "Navigator", "Document", "HtmlDocument", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "Clipboard", "ShareData", "KeyboardEvent", "NodeList", "Response", "FocusOptions", "MediaQueryList"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = "0.10"
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "chacha20"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
# NFC for new passwords (docs/plans/key-lifecycle.md §4, D3). Already in the lock through idna.
unicode-normalization = "0.1.25"
# Hybrid X25519 + ML-KEM-768 boxes and each account's ML-KEM key (docs/plans/key-lifecycle.md §7).
# Keys come from a seed and encapsulation from a random message, both drawn from the getrandom 0.2
# above, so ml-kem's own rand_core/getrandom 0.4 path is never compiled. `hazmat` only un-hides
# `encapsulate_deterministic`, which that needs.
ml-kem = { version = "=0.3.4", default-features = false, features = ["alloc", "hazmat"] }
hkdf = "0.12"

# Web only. dioxus-web implements document::eval with `new Function(...)`, which the app's CSP
# forbids (script-src has 'wasm-unsafe-eval', not 'unsafe-eval' - see nginx/nginx.conf), and the
# resulting JS exception unwinds the wasm stack and kills the whole app. Everything the web build
# used to do through eval is done through these bindings instead. Native targets (server, mobile
# WebView) keep using eval - no CSP applies there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

# dioxus-desktop (aliased as dioxus::mobile) - DeepLinkListener subscribes to tao events through it.
# Must stay target-scoped, not a cargo feature: `dx bundle --platform android` also builds a server
# binary for the host, and a feature would drag wry/GTK (glib-sys) into that x86_64-linux pass.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
dioxus = { workspace = true, features = ["mobile"] }

# Tests only: `dioxus` and `dioxus-fullstack` both declare dioxus-html with
# default-features = false, so SerializedMouseData (needed to synthesise click events
# in the DropdownButton propagation tests) is not compiled in. Workspace resolver = 2
# keeps dev-dependency features out of `cargo build` / `dx bundle`.
[dev-dependencies]
dioxus-html = { version = "0.7.10", features = ["serialize"] }
# The plural-variant guard in i18n.rs asks CLDR which categories each language has.
intl_pluralrules = "7"
proptest = { version = "1", default-features = false, features = ["std"] }

# cargo-fuzz sets `--cfg fuzzing`: the entry points in src/fuzz.rs (see packages/ui/fuzz).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
