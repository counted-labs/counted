[package]
name = "web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
shared = { workspace = true }
api = { workspace = true }
tracing = "0.1.41"

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "shared/server", "api/server"]

# The locale fetch that precedes `dioxus::launch` on the browser build (see main.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
