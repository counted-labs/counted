[package]
name = "mobile"
version = "3.2.9"
edition = "2021"
publish = false

# F-Droid's versionCode: major*1000000 + minor*1000 + patch of `version` above, bumped with it.
# Checked by `android-fdroid-apk` in android.mk. The Play build asks the Play API instead.
[package.metadata.android]
version_code = 3002009

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
shared = { workspace = true }
api = { workspace = true }
tracing = "0.1.41"

# Persistent cookie store for auth session (native only)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = [
	"cookies",
	"rustls-tls",
], default-features = false }
reqwest_cookie_store = "0.8"
# reqwest 0.12 hard-wires ring, which has no ML-KEM; the aws-lc provider installed before the client
# is built offers X25519MLKEM768 first (main.rs install_tls_provider, SPEC 3.1).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }

# On-device receipt OCR. **Target-scoped, not a plain dependency**, for the same reason
# packages/ui/Cargo.toml scopes dioxus/mobile: `dx bundle --platform android` also runs a host cargo
# pass, and a plain `[dependencies]` entry would compile 31 MB of model weights and all of rten into
# that x86_64 pass on every mobile build. See docs/plans/ocr-receipt-scan.md.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ocr = { workspace = true }

# Android: JNI access to Context.getFilesDir() and ClipboardManager
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = { version = "0.21", default-features = false, features = ["invocation"] }

# iOS: UIPasteboard clipboard access, UIFeedbackGenerator haptics, UIActivityViewController share
# sheet, Foundation for persistent data dir
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = [
	"UIPasteboard",
	# All four: the concrete generators are gated on their own features *and* on the base class's.
	"UIFeedbackGenerator",
	"UIImpactFeedbackGenerator",
	"UINotificationFeedbackGenerator",
	"UISelectionFeedbackGenerator",
	# Share sheet: the initializer is gated on UIActivity, keyWindow on UIView + UIWindow,
	# popoverPresentationController on both popover features.
	"UIActivityViewController",
	"UIActivity",
	"UIApplication",
	"UIWindow",
	"UIView",
	"UIViewController",
	"UIPopoverPresentationController",
	"UIPresentationController",
	# The named launch colour on the window, the webview and its scroll view.
	"UIColor",
	"UIScrollView",
	# The status-bar tap: UIScrollViewDelegate's scrollViewShouldScrollToTop: and UIView's
	# superview are gated on it (wry turns it on too; named so this does not lean on that).
	"UIResponder",
	# The iPad popover centred with no arrow: setSourceRect and bounds take a CGRect.
	"UIPopoverSupport",
	"objc2-core-foundation",
	# Launch background: the system appearance, read off the main screen before any window exists.
	"UIScreen",
	"UITraitCollection",
	"UIInterface",
	# The confirm: UIAlertController and its actions, whose handler is a block.
	"UIAlertController",
	# openURL:options:completionHandler:, the only openURL iOS 18 still honours, is gated on it.
	"block2",
] }
objc2-foundation = { version = "0.3", features = [
	"NSArray",
	"NSFileManager",
	"NSURL",
	"NSError",
	"NSString",
	"NSValue",
	"NSPathUtilities",
	# html[data-ios]: the OS major version for the head script.
	"NSProcessInfo",
	"NSData",
	"NSDictionary",
] }
# Push: the permission prompt, the completion block it takes, and the hop back to the main queue
# that registerForRemoteNotifications needs.
objc2-user-notifications = { version = "0.3", features = [
	"UNUserNotificationCenter",
	"block2",
] }
block2 = "0.6"
dispatch2 = "0.3"

[features]
default = []
web = ["dioxus/mobile"]
server = ["dioxus/server", "shared/server", "api/server"]
