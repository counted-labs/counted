[package]
name = "mobile"
version = "3.2.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
shared = { workspace = true }
api = { workspace = true }

# Serialisation
serde = "1.0"
serde_json = "1.0"

dotenvy = "0.15"
uuid = "1.6"
chrono = "0.4.41"
tracing = "0.1.41"

# optional
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "derive"], optional = true }
axum = { version = "0.7", optional = true }
dioxus-logger = "0.6.2"
web-sys = { version = "0.3.77", features = ["Window", "Storage"] }

# Persistent cookie store for auth session (native only)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["cookies", "rustls-tls"], default-features = false }
reqwest_cookie_store = "0.8"

# On-device receipt OCR. **Target-scoped, not a plain dependency**, for the same reason
# packages/ui/Cargo.toml scopes dioxus/mobile: `dx bundle --platform android` also runs a host cargo
# pass, and a plain `[dependencies]` entry would compile 31 MB of model weights and all of rten into
# that x86_64 pass on every mobile build. See docs/plans/ocr-receipt-scan.md.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ocr = { workspace = true }

# Android: JNI access to Context.getFilesDir() and ClipboardManager
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = { version = "0.21", default-features = false, features = ["invocation"] }

# iOS: UIPasteboard clipboard access, UIFeedbackGenerator haptics, UIActivityViewController share
# sheet, Foundation for persistent data dir
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = [
    "UIPasteboard",
    # All three: the two concrete generators are gated on their own features *and* on the base
    # class's, which is where prepare() lives.
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UINotificationFeedbackGenerator",
    # Share sheet: the initializer is gated on UIActivity, keyWindow on UIView + UIWindow,
    # popoverPresentationController on both popover features.
    "UIActivityViewController",
    "UIActivity",
    "UIApplication",
    "UIWindow",
    "UIView",
    "UIViewController",
    "UIPopoverPresentationController",
    "UIPresentationController",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSFileManager",
    "NSURL",
    "NSError",
    "NSString",
    "NSValue",
    "NSPathUtilities",
    "NSData",
] }
# Push: the permission prompt, the completion block it takes, and the hop back to the main queue
# that registerForRemoteNotifications needs.
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"

[features]
default = []
web = ["dioxus/mobile"]
server = ["dioxus/server", "sqlx", "axum", "shared/server", "api/server"]