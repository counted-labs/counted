# Checks, from outside, what counted.fr serves right now: its SHA256SUMS.txt must be a signed
# release's, every file it lists must hash to it, the app pages may load only those files, each
# script pinned by its `integrity`, and dx's own inline scripts, and the site pages may run no
# script at all. The rebuild workflow proves the
# sources make the release; this proves the release is what browsers get.
name: monitor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - name: Clone the monitor
        run: git clone -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src

      - name: Find the release counted.fr serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSf -o served.txt https://counted.fr/SHA256SUMS.txt
          tags=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            | jq -r '.[].tag_name | select(startswith("v"))')
          for tag in $tags; do
            base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
            if curl -sSfL "$base/SHA256SUMS.txt" | cmp -s - served.txt; then
              curl -sSfL -o SHA256SUMS.txt.sigstore.json "$base/SHA256SUMS.txt.sigstore.json"
              echo "counted.fr serves $tag"
              exit 0
            fi
          done
          echo "counted.fr serves a SHA256SUMS.txt that none of the last 30 releases carries" >&2
          exit 1

      - name: Verify the release's signature
        run: |
          curl -sSfL -o cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          chmod +x cosign
          ./cosign verify-blob --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity "https://gitlab.com/jbosi/counted//.gitlab-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://gitlab.com \
            served.txt

      - name: Check what counted.fr serves
        run: node src/.github/monitor.mjs served.txt
