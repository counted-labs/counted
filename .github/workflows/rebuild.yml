# Rebuilds every release on a GitHub VM that shares nothing with the machine that built it, and
# checks the result against the release's signed SHA256SUMS.txt (minus `server`, which only the
# private build produces). A green run is an independent, public proof that the client counted.fr
# serves as that version is what these sources produce.
name: rebuild

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (v1.21.0 or later - earlier releases carry no signature)
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - name: Clone the tag
        run: git clone -q --depth 1 --branch "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src

      - name: Build the client from scratch
        run: |
          docker buildx create --name builder --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx build --progress=plain --no-cache --platform linux/amd64 \
            -f src/Dockerfile.client --target sums --output type=local,dest=out src

      # After the build on purpose: the tag is pushed before the release and its assets exist.
      - name: Verify the release's signature
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -sSfLO "$base/SHA256SUMS.txt"
          curl -sSfLO "$base/SHA256SUMS.txt.sigstore.json"
          curl -sSfL -o cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          chmod +x cosign
          ./cosign verify-blob --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity "https://gitlab.com/jbosi/counted//.gitlab-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://gitlab.com \
            SHA256SUMS.txt

      - name: Compare
        run: |
          grep -v '  server$' SHA256SUMS.txt | diff - out/SHA256SUMS.txt
          echo "reproducible: $TAG rebuilt on GitHub matches its signed sums ($(wc -l < out/SHA256SUMS.txt) files)"
